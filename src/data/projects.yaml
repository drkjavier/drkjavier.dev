      - es: "Lógica geoespacial con turf: distancia, rumbo y polígonos, más geolocalización con permisos de dispositivo."
        en: "Geospatial logic with turf: distance, bearing and polygons, plus device geolocation with runtime permissions."
      - es: "Arquitectura offline-first con SQLite (react-native-quick-sqlite / sql.js), esquema sincronizado y migraciones locales."
        en: "Offline-first architecture with SQLite (react-native-quick-sqlite / sql.js), synced schema and local migrations."
      - es: "Captura con NFC (react-native-nfc-manager) para identificación de elementos en campo."
