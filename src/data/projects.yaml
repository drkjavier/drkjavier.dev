projects:
  - name: "Network Configuration Management System"
    company: "Ericsson Guatemala"
    period: "2018-2019"
    description:
      es: >
        Sistema de gestión de configuración de red que monitorea millones
        de nodos de red simultáneamente, permitiendo a los ingenieros de
        red administrar y configurar infraestructura de telecomunicaciones
        de manera eficiente. Proyecto empresarial propietario (sin
        repositorio público): backend de microservicios integrado con
        sistemas legacy y dashboard en tiempo real.
      en: >
        Network configuration management system that monitors millions of
        network nodes simultaneously, enabling network engineers to
        efficiently manage and configure telecommunications infrastructure.
        Proprietary enterprise project (no public repository): microservices
        backend integrated with legacy systems plus a real-time dashboard.
    highlights:
      - es: "Arquitectura de backend de microservicios usando Java/Spring Boot con Apache Camel para integración con sistemas legacy."
        en: "Architected microservices backend using Java/Spring Boot with Apache Camel for seamless legacy system integration."
      - es: "Integración de sistemas legacy mediante rutas y transformaciones de Apache Camel (patrones de integración EIP)."
        en: "Legacy system integration through Apache Camel routes and transformations (EIP integration patterns)."
      - es: "Dashboard administrativo en tiempo real con Angular 12 y TypeScript con visualización interactiva de datos."
        en: "Real-time administrative dashboard using Angular 12 and TypeScript with interactive data visualization."
      - es: "State management complejo y actualizaciones en tiempo real para monitorear millones de nodos simultáneamente."
        en: "Complex state management and real-time updates to monitor millions of network nodes simultaneously."
      - es: "Diseño de contratos REST para desacoplar el dashboard, los microservicios y los sistemas legacy."
        en: "Designed REST contracts to decouple the dashboard, microservices and legacy systems."
      - es: "Persistencia en Oracle para la configuración masiva de millones de nodos de red."
        en: "Oracle-backed persistence for mass configuration of millions of network nodes."
      - es: "Logré una reducción del 60% en tiempo de configuración manual para ingenieros de campo."
        en: "Achieved a 60% reduction in manual configuration time for field engineers through automation."
    technologies:
      - "Java"
      - "Spring Boot"
      - "Angular"
      - "TypeScript"
      - "Apache Camel"
      - "Oracle"
      - "REST APIs"

  - name: "drkjavier.dev"
    company: "Personal project"
    period: "2026"
    link: "https://github.com/drkjavier/drkjavier.dev"
    description:
      es: >
        Portafolio personal construido con Astro (SSG + arquitectura
        islands), Tailwind CSS y React solo donde hay interactividad, con
        contenido estructurado en YAML, internacionalización ES/EN con
        rutas independientes y despliegue continuo en Vercel.
      en: >
        Personal portfolio built with Astro (SSG + islands architecture),
        Tailwind CSS and React only where interactivity is needed, with
        YAML-driven content, ES/EN internationalization with independent
        routes and continuous deployment on Vercel.
    highlights:
      - es: "Sitio estático de alto rendimiento con rutas independientes para español e inglés (i18n de Astro)."
        en: "High-performance static site with independent routes for Spanish and English (Astro i18n)."
      - es: "Contenido desacoplado en archivos YAML (perfil, experiencia, proyectos, skills, educación) con loader en TypeScript: actualizar el sitio no requiere tocar componentes."
        en: "Content decoupled into YAML files (profile, experience, projects, skills, education) with a TypeScript loader: updating the site requires no component changes."
      - es: "Arquitectura islands: HTML estático con islas React solo donde hay estado (toggle de idioma)."
        en: "Islands architecture: static HTML with React islands only where state exists (language toggle)."
      - es: "Sistema de temas con CSS variables (design tokens) y Tailwind para estilos reutilizables."
        en: "Theming system with CSS variables (design tokens) and Tailwind for reusable styling."
      - es: "Build y despliegue automatizados con GitHub y Vercel."
        en: "Automated build and deploy with GitHub and Vercel."
      - es: "Componentes modulares (.astro + .tsx) manteniendo datos, layout y páginas separados."
        en: "Modular components (.astro + .tsx) keeping data, layout and pages separated."
    technologies:
      - "Astro"
      - "Tailwind CSS"
      - "React"
      - "TypeScript"
      - "YAML"
      - "Vercel"

  - name: "IT Tickets"
    company: "Personal project"
    period: "2026"
    link: "https://github.com/drkjavier/it-tickets"
    description:
      es: >
        Sistema de tickets construido con Next.js (App Router), Prisma y
        PostgreSQL: 13 modelos de dominio, más de 25 endpoints REST,
        editor enriquecido TipTap, almacenamiento de medios en Cloudinary,
        flujos asíncronos con Inngest y notificaciones por correo con
        Brevo.
      en: >
        Ticketing system built with Next.js (App Router), Prisma and
        PostgreSQL: 13 domain models, 25+ REST endpoints, TipTap rich-text
        editor, Cloudinary media storage, Inngest async workflows and
        Brevo email notifications.
    highlights:
      - es: "Editor enriquecido TipTap con imágenes, enlaces y sanitización de HTML en el servidor (DOMPurify)."
        en: "TipTap rich-text editor with images, links and server-side HTML sanitization (DOMPurify)."
      - es: "Autenticación con JWT (jose) y hash de contraseñas con bcryptjs, protegida por middleware con control de roles (admin/usuario)."
        en: "JWT authentication (jose) with bcryptjs password hashing, protected by middleware with role-based access control (admin/user)."
      - es: "Modelo de datos Prisma con 13 modelos y 7 enums: tickets, subtareas, comentarios, historial de estados, tags, notificaciones y cuota diaria de correos."
        en: "Prisma data model with 13 models and 7 enums: tickets, subtasks, comments, status history, tags, notifications and daily email quota."
      - es: "API REST con más de 25 route handlers (tickets, proyectos, usuarios, notificaciones, dashboard, salud del servicio)."
        en: "REST API with 25+ route handlers (tickets, projects, users, notifications, dashboard, service health)."
      - es: "Flujos asíncronos orquestados con Inngest (scheduler, notificaciones) y envío de correos transaccionales con Brevo y Resend."
        en: "Asynchronous workflows orchestrated with Inngest (scheduler, notifications) plus transactional emails via Brevo and Resend."
      - es: "Dashboards con Recharts, estado en cliente con Zustand y uploads a Cloudinary; desplegado en Vercel."
        en: "Recharts dashboards, client-side state with Zustand and Cloudinary uploads; deployed on Vercel."
    technologies:
